[package]
name = "pit-desk"
version = "1.1.0"
description = "Pit Desk: race-weekend IT service desk triage"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# Smaller installer: optimise for size and strip debug symbols.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
