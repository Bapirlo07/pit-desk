name: Desktop app release

# Builds Windows, macOS and Linux installers and attaches them to a GitHub Release.
# Run it by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
# (or start it by hand from the Actions tab).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds one universal app for Intel and Apple Silicon.
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Pit Desk v__VERSION__'
          releaseBody: |
            Desktop installers for Pit Desk, the race-weekend IT service desk triage tool.

            **Which file do I download?**
            - **Windows:** `Pit.Desk_x.x.x_x64-setup.exe` (or the `.msi`)
            - **macOS (Intel & Apple Silicon):** `Pit.Desk_x.x.x_universal.dmg`
            - **Linux:** `.AppImage` (any distro), `.deb` (Ubuntu/Debian) or `.rpm` (Fedora)

            The installers aren't code-signed, so on first launch:
            - **Windows:** "Windows protected your PC" → **More info** → **Run anyway**
            - **macOS:** right-click the app → **Open** → **Open** (or System Settings → Privacy & Security → **Open Anyway**)

            Prefer no install? Use it in the browser: https://bapirlo07.github.io/pit-desk/
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
